blueprint:
  name: Codex-LB Rates quota warning with hysteresis
  description: >-
    Warn once when a remaining-percentage sensor drops to or below the threshold,
    then rearm after remaining rises by the recovery margin. Creates an optional
    Home Assistant persistent notification and/or Companion phone notification.
    Create a dedicated input_boolean helper without a forced initial value so its
    state survives restarts. Each automation needs its own helper. Unknown or
    non-numeric readings leave the helper unchanged. Failed actions may retry;
    delivery is not guaranteed exactly once.
  domain: automation
  homeassistant:
    min_version: "2024.8.0"
  input:
    remaining_sensor:
      name: Remaining percentage sensor
      description: >-
        Select a Codex-LB Rates remaining-% sensor (account or pool), not a
        consumed-usage value. Unit must be %.
      selector:
        entity:
          filter:
            domain: sensor
            unit_of_measurement: "%"
    warning_state:
      name: Persistent warning helper (required)
      description: >-
        **Required.** Create a Toggle helper first
        (Settings → Devices & services → Helpers), leave its initial value
        unset, then select it here. Use one helper per automation.
      selector:
        entity:
          filter:
            domain: input_boolean
    warning_threshold:
      name: Warning threshold (remaining %)
      description: Warn when remaining is at or below this value.
      default: 20
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: box
    hysteresis:
      name: Recovery margin
      description: >-
        Percentage points above the threshold required to rearm the warning
        (remaining must reach threshold + margin).
      default: 5
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: pp
          mode: box
    notification_section:
      name: Notifications
      icon: mdi:bell-badge
      description: >-
        Built-in HA UI and Companion phone alerts. Leave phones empty to skip
        mobile notifications.
      collapsed: true
      input:
        enable_persistent:
          name: Home Assistant persistent notification
          description: >-
            Show a dismissible notification in the Home Assistant UI when the
            warning fires. Dismissed automatically when the warning rearms.
          default: true
          selector:
            boolean:
        notify_devices:
          name: Phones to notify
          description: >-
            Optional. Companion app devices (`mobile_app`). Leave empty to skip
            phone notifications. Cleared automatically when the warning rearms.
            Uses each device's `notify.mobile_app_*` service derived from the
            Companion device name (not a Home Assistant UI rename).
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        notification_title:
          name: Notification title
          description: Title used for persistent and phone notifications.
          default: "⚠️ Codex-LB Rates quota low"
          selector:
            text:
        notification_subtitle:
          name: Notification subtitle
          description: >-
            Secondary line on Companion notifications (iOS subtitle / Android
            subject). Leave blank to omit.
          default: "Quota remaining is below your threshold"
          selector:
            text:
        notification_message:
          name: Notification message
          description: >-
            Body for persistent and phone notifications. Templates may use
            `remaining_entity`, `remaining`, and `threshold`. Companion apps
            also get color, icon, channel, and subtitle styling.
          default: |
            {{ state_attr(remaining_entity, 'friendly_name') or remaining_entity }} is at {{ remaining }}% remaining.

            Threshold: {{ threshold }}%
          selector:
            text:
              multiline: true
        warning_action:
          name: Additional warning actions
          description: >-
            Optional extra actions after built-in notifications (TTS, scripts,
            etc.). Leave empty if persistent and/or phone notify is enough.
          default: []
          selector:
            action: {}

triggers:
  - trigger: state
    entity_id: !input remaining_sensor
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: "/5"

variables:
  remaining_entity: !input remaining_sensor
  threshold: !input warning_threshold
  recovery_margin: !input hysteresis
  warning_helper: !input warning_state
  enable_persistent: !input enable_persistent
  notify_devices: !input notify_devices
  notify_subtitle: !input notification_subtitle
  remaining: "{{ states(remaining_entity) | float(-1) }}"
  recover_at: "{{ [100, threshold | float + recovery_margin | float] | min }}"
  notification_id: "codex_rates_{{ warning_helper | slugify }}"
  notification_tag: "codex_rates_{{ warning_helper | slugify }}"
  # Margin 0: rearm only when remaining is strictly above the threshold so
  # HA start / 5m ticks do not oscillate warn ↔ rearm at exactly the threshold.
  should_recover: >-
    {{ is_state(warning_helper, 'on') and (
         (recovery_margin | float == 0 and remaining | float(-1) > threshold | float)
         or (recovery_margin | float > 0 and remaining | float(-1) >= recover_at | float)
       ) }}
  should_warn: >-
    {{ is_state(warning_helper, 'off')
       and remaining | float(-1) <= threshold | float }}

actions:
  - condition: template
    value_template: >-
      {{ is_number(states(remaining_entity))
         and 0 <= remaining <= 100
         and state_attr(remaining_entity, 'unit_of_measurement') == '%'
         and states(warning_helper) in ['on', 'off'] }}
  - choose:
      - conditions: "{{ should_recover }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ enable_persistent }}"
            then:
              - action: persistent_notification.dismiss
                data:
                  notification_id: "{{ notification_id }}"
          - repeat:
              for_each: !input notify_devices
              sequence:
                - variables:
                    notify_target: >-
                      {{
                        "notify.mobile_app_" ~ (
                          device_attr(repeat.item, "name") or ""
                        ) | slugify
                      }}
                - condition: template
                  value_template: "{{ notify_target != 'notify.mobile_app_' }}"
                - action: "{{ notify_target }}"
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ notification_tag }}"
          - action: input_boolean.turn_off
            target:
              entity_id: !input warning_state
      - conditions: "{{ should_warn }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ enable_persistent }}"
            then:
              - action: persistent_notification.create
                data:
                  title: !input notification_title
                  message: !input notification_message
                  notification_id: "{{ notification_id }}"
          - repeat:
              for_each: !input notify_devices
              sequence:
                - variables:
                    notify_target: >-
                      {{
                        "notify.mobile_app_" ~ (
                          device_attr(repeat.item, "name") or ""
                        ) | slugify
                      }}
                - condition: template
                  value_template: "{{ notify_target != 'notify.mobile_app_' }}"
                - action: "{{ notify_target }}"
                  data:
                    title: !input notification_title
                    message: !input notification_message
                    data:
                      tag: "{{ notification_tag }}"
                      group: codex_rates_quota
                      color: "#C45C26"
                      notification_icon: mdi:gauge-empty
                      importance: high
                      channel: Codex-LB Rates
                      subtitle: "{{ notify_subtitle }}"
                      subject: "{{ notify_subtitle }}"
          # Arm before optional extras so a failed extra action does not re-send
          # built-in persistent/phone notifications on the next poll.
          - action: input_boolean.turn_on
            target:
              entity_id: !input warning_state
          - sequence: !input warning_action

mode: single
max_exceeded: silent
