blueprint:
  name: Codex-LB Rates quota alerts (v2.0.0)
  description: >-
    Blueprint version: 2.0.0. Alert on remaining-% sensors for low quota,
    quota exceeded, and quota refreshed. Select one or more sensors (pool
    and/or accounts). Uses one Text helper to remember which alerts already
    fired so you are not spammed. Runs when a selected percentage state
    changes, when Home Assistant starts, and after automations reload; there is
    no periodic polling.
  domain: automation
  author: uniskela
  homeassistant:
    min_version: "2026.5.0"
  input:
    sensors_section:
      name: Sensors and helper
      icon: mdi:gauge
      input:
        remaining_sensors:
          name: Remaining percentage sensors
          description: >-
            One or more Codex-LB Rates remaining-% sensors (pool and/or
            accounts). Unit must be %.
          selector:
            entity:
              multiple: true
              filter:
                domain: sensor
                unit_of_measurement: "%"
        alert_state:
          name: Alert state helper (required)
          description: >-
            **Required.** Create a **Text** helper first (Settings → Devices &
            services → Helpers), set **Maximum length** to **255**, leave the
            initial value empty, then select it here. One helper per
            automation. The blueprint initializes an empty/unknown helper and
            stores compact alert-state tokens automatically.
          selector:
            entity:
              filter:
                domain: input_text
    levels_section:
      name: Alert levels
      icon: mdi:alert-decagram
      collapsed: false
      input:
        enable_low:
          name: Enable low-quota alert
          description: Notify when remaining drops into the low band (above exceeded).
          default: true
          selector:
            boolean:
        low_threshold:
          name: Low threshold (remaining %)
          default: 20
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
              mode: box
        low_hysteresis:
          name: Low recovery margin
          description: Rearm low alert when remaining ≥ low threshold + margin.
          default: 5
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: pp
              mode: box
        enable_exceeded:
          name: Enable quota-exceeded alert
          description: Notify when remaining is at or below the exceeded threshold.
          default: true
          selector:
            boolean:
        exceed_threshold:
          name: Exceeded threshold (remaining %)
          default: 0
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
              mode: box
        exceed_hysteresis:
          name: Exceeded recovery margin
          description: Rearm exceeded alert when remaining > exceeded threshold + margin.
          default: 1
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: pp
              mode: box
        enable_refreshed:
          name: Enable quota-refreshed alert
          description: >-
            Notify when remaining rises to the refresh threshold after a prior
            low or exceeded alert for that sensor (avoids notifying on first
            install while already full).
          default: true
          selector:
            boolean:
        refresh_threshold:
          name: Refreshed threshold (remaining %)
          default: 100
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
              mode: box
        refresh_rearm:
          name: Refreshed rearm below
          description: Rearm refreshed alert when remaining drops to or below this value.
          default: 90
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
              mode: box
    notification_section:
      name: Notifications
      icon: mdi:bell-badge
      description: >-
        HA UI and Companion phone alerts. Leave phones empty to skip mobile
        notifications. Titles/messages support templates using remaining_entity,
        remaining, friendly_name, and event. Companion phones are targeted via
        their notify entities instead of guessed notify.mobile_app service names.
      collapsed: true
      input:
        enable_persistent:
          name: Home Assistant persistent notification
          default: true
          selector:
            boolean:
        notify_devices:
          name: Phones to notify
          description: >-
            Optional Companion (`mobile_app`) devices. Home Assistant resolves
            each selected device to its notify entity using `notify.send_message`.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        title_low:
          name: Low alert title
          default: "⚠️ Codex-LB Rates quota low"
          selector:
            text:
        subtitle_low:
          name: Low alert subtitle
          description: >-
            Kept for compatibility and available to additional actions as
            `notify_subtitle`. Standard notify-entity phone delivery uses title
            and message only.
          default: "Remaining quota is running low"
          selector:
            text:
        message_low:
          name: Low alert message
          default: |
            {{ friendly_name }} is at {{ remaining }}% remaining.

            Threshold: {{ low_threshold }}%
          selector:
            text:
              multiline: true
        title_exceeded:
          name: Exceeded alert title
          default: "🚨 Codex-LB Rates quota exceeded"
          selector:
            text:
        subtitle_exceeded:
          name: Exceeded alert subtitle
          description: >-
            Kept for compatibility and available to additional actions as
            `notify_subtitle`. Standard notify-entity phone delivery uses title
            and message only.
          default: "No remaining quota left"
          selector:
            text:
        message_exceeded:
          name: Exceeded alert message
          default: |
            {{ friendly_name }} is at {{ remaining }}% remaining.

            Quota exceeded (threshold {{ exceed_threshold }}%).
          selector:
            text:
              multiline: true
        title_refreshed:
          name: Refreshed alert title
          default: "✅ Codex-LB Rates quota refreshed"
          selector:
            text:
        subtitle_refreshed:
          name: Refreshed alert subtitle
          description: >-
            Kept for compatibility and available to additional actions as
            `notify_subtitle`. Standard notify-entity phone delivery uses title
            and message only.
          default: "Quota has been restored"
          selector:
            text:
        message_refreshed:
          name: Refreshed alert message
          default: |
            {{ friendly_name }} is at {{ remaining }}% remaining.

            Quota refreshed (threshold {{ refresh_threshold }}%).
          selector:
            text:
              multiline: true
        extra_actions:
          name: Additional actions after any alert
          description: Optional TTS, scripts, etc. Runs after an alert is armed.
          default: []
          selector:
            action: {}

triggers:
  - trigger: state
    id: percentage_changed
    entity_id: !input remaining_sensors
    to: null
  - trigger: homeassistant
    id: home_assistant_started
    event: start
  - trigger: event
    id: automations_reloaded
    event_type: automation_reloaded

variables:
  state_helper: !input alert_state
  enable_low: !input enable_low
  low_threshold: !input low_threshold
  low_hysteresis: !input low_hysteresis
  enable_exceeded: !input enable_exceeded
  exceed_threshold: !input exceed_threshold
  exceed_hysteresis: !input exceed_hysteresis
  enable_refreshed: !input enable_refreshed
  refresh_threshold: !input refresh_threshold
  refresh_rearm: !input refresh_rearm
  enable_persistent: !input enable_persistent
  notify_devices: !input notify_devices
  sensors: !input remaining_sensors
  sensors_to_check: >-
    {{ [trigger.entity_id]
       if trigger is defined and trigger.platform == 'state'
       else sensors }}

actions:
  # The helper selector guarantees an input_text when the automation is saved.
  # Still validate it in case the helper was later deleted or disabled. A real
  # helper in the normal initial `unknown` state is allowed and initialized by
  # the next action.
  - alias: Validate alert-state helper
    if:
      - condition: template
        value_template: >-
          {{ sensors | count == 0
             or state_helper not in (states.input_text | map(attribute='entity_id') | list)
             or states(state_helper) == 'unavailable' }}
    then:
      - stop: >-
          Alert state helper is missing or unavailable, or no remaining
          percentage sensors are configured.
        error: true

  - alias: Initialize new alert-state helper
    if:
      - condition: template
        value_template: "{{ states(state_helper) == 'unknown' }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: !input alert_state
        data:
          value: ""

  # v2 compact state migration. Legacy values used the complete entity_id for
  # every flag and could overflow input_text's 255-character maximum. Preserve
  # any known v1 flags but rewrite them as an 8-hex stable entity hash + event.
  - alias: Read alert-state tokens
    variables:
      state_source: >-
        {% set raw = states(state_helper) %}
        {{ '' if raw in ['unknown', 'unavailable', 'none'] else raw }}
  - alias: Build compact alert-state tokens
    variables:
      state_compact: >-
        {% set raw_tokens = state_source.split() %}
        {% set ns = namespace(tokens=[]) %}
        {% for entity in sensors %}
          {% set key = sha1(entity)[:8] %}
          {% for event_name, event_code in [('low', 'l'), ('exceeded', 'e'), ('refreshed', 'r')] %}
            {% set compact = key ~ ':' ~ event_code %}
            {% set legacy = entity ~ '::' ~ event_name %}
            {% if compact in raw_tokens or legacy in raw_tokens %}
              {% set ns.tokens = ns.tokens + [compact] %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {{ ns.tokens | unique | list | join(' ') }}
  - alias: Migrate legacy alert-state tokens
    if:
      - condition: template
        value_template: "{{ state_source != state_compact }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: !input alert_state
        data:
          value: "{{ state_compact }}"

  - alias: Evaluate selected quota sensors
    repeat:
      for_each: "{{ sensors_to_check }}"
      sequence:
        - variables:
            remaining_entity: "{{ repeat.item }}"
            remaining: "{{ states(repeat.item) | float(-1) }}"
            friendly_name: >-
              {{ state_attr(repeat.item, 'friendly_name') or repeat.item }}
            state_raw: >-
              {% set raw = states(state_helper) %}
              {{ '' if raw in ['unknown', 'unavailable', 'none'] else raw }}
            token_key: "{{ sha1(repeat.item)[:8] }}"
            low_recover_at: >-
              {{ [100, low_threshold | float + low_hysteresis | float] | min }}
            exceed_recover_above: >-
              {{ exceed_threshold | float + exceed_hysteresis | float }}
            sensor_ok: >-
              {{ is_number(states(repeat.item))
                 and 0 <= states(repeat.item) | float(-1) <= 100
                 and state_attr(repeat.item, 'unit_of_measurement') == '%' }}
        - variables:
            token_low: "{{ token_key }}:l"
            token_exceeded: "{{ token_key }}:e"
            token_refreshed: "{{ token_key }}:r"
            armed_low: "{{ token_key ~ ':l' in state_raw.split() }}"
            armed_exceeded: "{{ token_key ~ ':e' in state_raw.split() }}"
            armed_refreshed: "{{ token_key ~ ':r' in state_raw.split() }}"
        - alias: Validate quota sensor
          condition: template
          value_template: "{{ sensor_ok }}"

        # --- Exceeded ---
        - if:
            - condition: template
              value_template: >-
                {{ enable_exceeded
                   and not armed_exceeded
                   and remaining | float(-1) <= exceed_threshold | float }}
          then:
            - variables:
                event: exceeded
                notify_subtitle: !input subtitle_exceeded
                notification_id: "codex_rates_{{ remaining_entity | slugify }}_exceeded"
                state_after_arm: >-
                  {{ (state_raw.split() + [token_exceeded])
                     | unique | list | join(' ') }}
            - if:
                - condition: template
                  value_template: "{{ enable_persistent }}"
              then:
                - action: persistent_notification.create
                  data:
                    title: !input title_exceeded
                    message: !input message_exceeded
                    notification_id: "{{ notification_id }}"
            - if:
                - condition: template
                  value_template: "{{ notify_devices | count > 0 }}"
              then:
                - action: notify.send_message
                  target:
                    device_id: !input notify_devices
                  data:
                    title: !input title_exceeded
                    message: !input message_exceeded
            - action: input_text.set_value
              target:
                entity_id: !input alert_state
              data:
                value: "{{ state_after_arm }}"
            - sequence: !input extra_actions

        # --- Low (band above exceeded) ---
        - variables:
            state_raw: >-
              {% set raw = states(state_helper) %}
              {{ '' if raw in ['unknown', 'unavailable', 'none'] else raw }}
            armed_low: "{{ token_low in states(state_helper).split() }}"
            armed_exceeded: "{{ token_exceeded in states(state_helper).split() }}"
            armed_refreshed: "{{ token_refreshed in states(state_helper).split() }}"
        - if:
            - condition: template
              value_template: >-
                {{ enable_low
                   and not armed_low
                   and remaining | float(-1) <= low_threshold | float
                   and (
                     not enable_exceeded
                     or remaining | float(-1) > exceed_threshold | float
                   ) }}
          then:
            - variables:
                event: low
                notify_subtitle: !input subtitle_low
                notification_id: "codex_rates_{{ remaining_entity | slugify }}_low"
                state_after_arm: >-
                  {{ (state_raw.split() + [token_low])
                     | unique | list | join(' ') }}
            - if:
                - condition: template
                  value_template: "{{ enable_persistent }}"
              then:
                - action: persistent_notification.create
                  data:
                    title: !input title_low
                    message: !input message_low
                    notification_id: "{{ notification_id }}"
            - if:
                - condition: template
                  value_template: "{{ notify_devices | count > 0 }}"
              then:
                - action: notify.send_message
                  target:
                    device_id: !input notify_devices
                  data:
                    title: !input title_low
                    message: !input message_low
            - action: input_text.set_value
              target:
                entity_id: !input alert_state
              data:
                value: "{{ state_after_arm }}"
            - sequence: !input extra_actions

        # --- Refreshed ---
        - variables:
            state_raw: >-
              {% set raw = states(state_helper) %}
              {{ '' if raw in ['unknown', 'unavailable', 'none'] else raw }}
            armed_low: "{{ token_low in states(state_helper).split() }}"
            armed_exceeded: "{{ token_exceeded in states(state_helper).split() }}"
            armed_refreshed: "{{ token_refreshed in states(state_helper).split() }}"
        - if:
            - condition: template
              value_template: >-
                {{ enable_refreshed
                   and not armed_refreshed
                   and remaining | float(-1) >= refresh_threshold | float
                   and (armed_low or armed_exceeded) }}
          then:
            - variables:
                event: refreshed
                notify_subtitle: !input subtitle_refreshed
                notification_id: "codex_rates_{{ remaining_entity | slugify }}_refreshed"
                state_after_arm: >-
                  {{
                    (
                      state_raw.split()
                      | reject('eq', token_low)
                      | reject('eq', token_exceeded)
                      | list
                      + [token_refreshed]
                    )
                    | unique | list | join(' ')
                  }}
            - if:
                - condition: template
                  value_template: "{{ enable_persistent }}"
              then:
                - action: persistent_notification.dismiss
                  data:
                    notification_id: "codex_rates_{{ remaining_entity | slugify }}_low"
                - action: persistent_notification.dismiss
                  data:
                    notification_id: "codex_rates_{{ remaining_entity | slugify }}_exceeded"
                - action: persistent_notification.create
                  data:
                    title: !input title_refreshed
                    message: !input message_refreshed
                    notification_id: "{{ notification_id }}"
            - if:
                - condition: template
                  value_template: "{{ notify_devices | count > 0 }}"
              then:
                - action: notify.send_message
                  target:
                    device_id: !input notify_devices
                  data:
                    title: !input title_refreshed
                    message: !input message_refreshed
            - action: input_text.set_value
              target:
                entity_id: !input alert_state
              data:
                value: "{{ state_after_arm }}"
            - sequence: !input extra_actions

        # --- Rearm / clear recovered flags ---
        - variables:
            state_raw: >-
              {% set raw = states(state_helper) %}
              {{ '' if raw in ['unknown', 'unavailable', 'none'] else raw }}
            armed_low: "{{ token_low in states(state_helper).split() }}"
            armed_exceeded: "{{ token_exceeded in states(state_helper).split() }}"
            armed_refreshed: "{{ token_refreshed in states(state_helper).split() }}"
            should_clear_low: >-
              {{ armed_low and (
                   (low_hysteresis | float == 0 and remaining | float(-1) > low_threshold | float)
                   or (low_hysteresis | float > 0 and remaining | float(-1) >= low_recover_at | float)
                 ) }}
            should_clear_exceeded: >-
              {{ armed_exceeded
                 and remaining | float(-1) > exceed_recover_above | float }}
            should_clear_refreshed: >-
              {{ armed_refreshed
                 and remaining | float(-1) <= refresh_rearm | float }}
        - if:
            - condition: template
              value_template: "{{ should_clear_low }}"
          then:
            - if:
                - condition: template
                  value_template: "{{ enable_persistent }}"
              then:
                - action: persistent_notification.dismiss
                  data:
                    notification_id: "codex_rates_{{ remaining_entity | slugify }}_low"
            - action: input_text.set_value
              target:
                entity_id: !input alert_state
              data:
                value: >-
                  {{ state_raw.split()
                     | reject('eq', token_low)
                     | list | join(' ') }}
        - variables:
            state_raw: >-
              {% set raw = states(state_helper) %}
              {{ '' if raw in ['unknown', 'unavailable', 'none'] else raw }}
        - if:
            - condition: template
              value_template: "{{ should_clear_exceeded }}"
          then:
            - if:
                - condition: template
                  value_template: "{{ enable_persistent }}"
              then:
                - action: persistent_notification.dismiss
                  data:
                    notification_id: "codex_rates_{{ remaining_entity | slugify }}_exceeded"
            - action: input_text.set_value
              target:
                entity_id: !input alert_state
              data:
                value: >-
                  {{ state_raw.split()
                     | reject('eq', token_exceeded)
                     | list | join(' ') }}
        - variables:
            state_raw: >-
              {% set raw = states(state_helper) %}
              {{ '' if raw in ['unknown', 'unavailable', 'none'] else raw }}
        - if:
            - condition: template
              value_template: "{{ should_clear_refreshed }}"
          then:
            - if:
                - condition: template
                  value_template: "{{ enable_persistent }}"
              then:
                - action: persistent_notification.dismiss
                  data:
                    notification_id: "codex_rates_{{ remaining_entity | slugify }}_refreshed"
            - action: input_text.set_value
              target:
                entity_id: !input alert_state
              data:
                value: >-
                  {{ state_raw.split()
                     | reject('eq', token_refreshed)
                     | list | join(' ') }}

mode: queued
max: 10
max_exceeded: silent